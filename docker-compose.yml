name: laradger

x-app: &app
  build:
    context: .
    target: development
    args:
      WITH_XDEBUG: ${WITH_XDEBUG:-false}
  image: laradger-app:dev
  init: true
  restart: unless-stopped
  volumes:
    - .:/var/www/html
    - app-vendor:/var/www/html/vendor

# Kept as its own anchor: a service-level `environment:` replaces the anchor's
# map instead of merging it, so every service spreads these keys explicitly.
x-app-env: &app-env
  APP_ENV: ${APP_ENV:-local}
  XDEBUG_MODE: ${XDEBUG_MODE:-off}

services:
  app:
    <<: *app
    command: ["php-fpm", "-F"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  web:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=1", "--timeout=0", "--sleep=3", "--max-time=3600"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    depends_on:
      app:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    profiles: ["mail"]

volumes:
  app-vendor:
