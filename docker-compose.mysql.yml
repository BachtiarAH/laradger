# Overlay: use MySQL 8.4 instead of the default SQLite database.
#
#   docker compose -f docker-compose.yml -f docker-compose.mysql.yml up -d
#
# The DB_* values below win over the host .env, so the app, queue worker and
# scheduler can never point at different databases.
x-db-env: &db-env
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE:-laradger}
  DB_USERNAME: ${DB_USERNAME:-laradger}
  DB_PASSWORD: ${DB_PASSWORD:-secret}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--innodb-buffer-pool-size=256M"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laradger}
      MYSQL_USER: ${DB_USERNAME:-laradger}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    environment: *db-env
    depends_on:
      mysql:
        condition: service_healthy

  queue:
    environment: *db-env
    depends_on:
      mysql:
        condition: service_healthy

  scheduler:
    environment: *db-env
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
