; Replaces the stock www pool. clear_env must stay "no" so that variables
; injected by docker-compose (DB_HOST, DB_CONNECTION, ...) reach PHP.
[www]
user = www-data
group = www-data

listen = 0.0.0.0:9000
listen.backlog = 511

pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

clear_env = no
catch_workers_output = yes
decorate_workers_output = no

access.log = /proc/self/fd/2
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
