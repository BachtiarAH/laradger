; Development overrides — verbose errors, no opcache, xdebug on demand.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
opcache.enable = 0
opcache.validate_timestamps = 1
memory_limit = 512M

; Ignored when the image is built without WITH_XDEBUG=true.
xdebug.mode = develop
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = VSCODE
